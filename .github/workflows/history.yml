name: History Short Pipeline

on:
  schedule:
    - cron: "0 4 * * *" # Daily at 04:00 UTC (09:30 AM IST)
  workflow_dispatch:

concurrency:
  group: history-pipeline
  cancel-in-progress: false

jobs:
  build-history-short:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run History Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.6-flash"
        run: |
          python run_pipeline.py --channel history --stage all

      - name: Commit Topic Database Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history_data/previous_topics.json
          git commit -m "chore: update history topic database [skip ci]" || echo "No topic updates to commit"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload Generated History Short Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: history-short-pack
          path: history_output/
          retention-days: 14
